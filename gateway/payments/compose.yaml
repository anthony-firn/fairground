services:
  payments:
    build:
      context: ../..
      dockerfile: gateway/payments/Dockerfile
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    tmpfs: [/tmp:size=16m]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PAYMENTS_HOST: ${PAYMENTS_HOST:?set PAYMENTS_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  caddy_data:
  caddy_config:
